<!doctype html>

<html>
  <head>
    <meta charset="utf-8">
    <title>GLYF Node Texture Creator</title>

    <link rel="stylesheet" href="./style.css">
  </head>

  <body>
    <div id="app">
      <div id="rete">
        <div class="rete-export">
          <input id="importGlyfInput" type="file" accept=".glyf,application/octet-stream" hidden>
          <button id="importGlyfButton" type="button">Import GLYF</button>
          <button id="exportGlyfButton" type="button">Export to GLYF</button>
          <button id="exportPngButton" type="button">Export 4K PNG</button>
        </div>
      </div>
      <div
        id="editorPreviewDivider"
        class="splitter vertical-splitter"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize node editor and preview"
        tabindex="0"
      ></div>
      <main id="mainWorkspace">
        <div id="canvasPane">
          <canvas id="mainCanvas" aria-label="WebGPU texture preview"></canvas>
        </div>
        <div
          id="previewPanelDivider"
          class="splitter horizontal-splitter"
          role="separator"
          aria-orientation="horizontal"
          aria-label="Resize preview and reserved panel"
          tabindex="0"
        ></div>
        <div id="reservedPanel" aria-label="Node execution costs">
          <div class="cost-controls">
            <label>
              Caching
              <select id="cacheMode">
                <option value="static">Static intermediate caching</option>
                <option value="outputs">No intermediate caching</option>
              </select>
            </label>

            <button id="profileCosts" type="button">
              Measure costs for selected caching mode
            </button>
          </div>

          <p id="costSummary"></p>
          <p id="costStatus" role="status"></p>

          <table>
            <thead>
              <tr>
                <th>Node</th>
                <th>Updates</th>
                <th>Sample time (ms)</th>
                <th>Image (MiB)</th>
                <th>State</th>
              </tr>
            </thead>
            <tbody id="costRows"></tbody>
          </table>
        </div>
      </main>
    </div>
    <div id="exportStatus" role="status" aria-live="polite"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
